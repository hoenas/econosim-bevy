[package]
name = "econosim-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.0"
bevy_egui = "0.39.0"
burn = { version = "0.19.1", features = ["autodiff", "fusion", "wgpu"] }
burn-train = "0.19.1"
egui_plot = "0.34"
itertools = "0.14.0"
# naga 26 (from burn/cubecl-wgpu) has a cfg mismatch: without this the DiagnosticBuffer
# uses String which doesn't implement WriteColor, but codespan-reporting always expects it.
naga = { version = "=26.0.0", features = ["termcolor"] }
ordered-float = "5.1.0"
plotters = "0.3.7"
rand = "0.9.2"
